<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DealDekho - Download</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4f4,#f7f9ff);color:#222}
.wrap{max-width:520px;margin:auto;padding:28px 18px}
.card{background:#fff;border-radius:22px;padding:26px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.logo{font-size:34px;font-weight:800;color:#e53935;margin-bottom:6px}
.sub{color:#666;margin-bottom:24px}
button{border:0;border-radius:14px;padding:15px 20px;font-size:17px;font-weight:700;width:100%;cursor:pointer}
#downloadBtn{background:#e53935;color:white;box-shadow:0 5px 16px rgba(229,57,53,.25)}
#installBtn{background:#16a34a;color:white;margin-top:14px}
#status{margin-top:18px;font-weight:600;color:#555}
.progressBox{display:none;margin-top:18px}
.track{height:12px;background:#eee;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#e53935;border-radius:20px;transition:width .2s}
.percent{margin-top:8px;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);align-items:center;justify-content:center;padding:20px;z-index:10}
.modalBox{background:white;width:100%;max-width:400px;border-radius:22px;padding:28px 20px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.3)}
.icon{font-size:50px;margin-bottom:8px}
.modal h2{margin:5px 0 8px}
.modal p{color:#666;line-height:1.5;margin-bottom:20px}
.small{font-size:13px;color:#888;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">DealDekho</div>
    <div class="sub">Download and install the latest app</div>

    <button id="downloadBtn">⬇️ Download & Install</button>

    <div class="progressBox" id="progressBox">
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>

    <div id="status">Ready to download</div>
    <div class="small">Official DealDekho APK</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modalBox">
    <div class="icon">📲</div>
    <h2>DealDekho Ready</h2>
    <p>Download complete. Ab DealDekho install karne ke liye neeche button dabayein.</p>
    <button id="installBtn">Install DealDekho</button>
    <div class="small">Android ka system permission screen alag se aa sakta hai.</div>
  </div>
</div>

<script>
const APK = "DealDekho.apk";
let apkBlobUrl = null;

const downloadBtn = document.getElementById("downloadBtn");
const progressBox = document.getElementById("progressBox");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const modal = document.getElementById("modal");
const installBtn = document.getElementById("installBtn");

downloadBtn.addEventListener("click", async () => {
  downloadBtn.disabled = true;
  downloadBtn.textContent = "Downloading...";
  progressBox.style.display = "block";
  status.textContent = "DealDekho download ho raha hai...";

  try {
    const response = await fetch(APK + "?v=" + Date.now(), {cache:"no-store"});
    if (!response.ok) throw new Error("Download failed");

    const total = Number(response.headers.get("content-length")) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;

      if (total) {
        const p = Math.min(100, Math.round(received / total * 100));
        bar.style.width = p + "%";
        percent.textContent = p + "%";
      } else {
        percent.textContent = "Downloading...";
      }
    }

    const blob = new Blob(chunks, {type:"application/vnd.android.package-archive"});
    apkBlobUrl = URL.createObjectURL(blob);

    bar.style.width = "100%";
    percent.textContent = "100%";
    status.textContent = "Download complete ✅";
    downloadBtn.textContent = "Downloaded ✅";

    // Popup automatically opens on this same page.
    setTimeout(() => { modal.style.display = "flex"; }, 350);

  } catch (e) {
    status.textContent = "Download nahi ho paya. Dobara try karein.";
    downloadBtn.disabled = false;
    downloadBtn.textContent = "⬇️ Download & Install";
  }
});

installBtn.addEventListener("click", () => {
  // Open the APK file directly; Android/browser controls the final install step.
  window.location.href = APK;
});

modal.addEventListener("click", (e) => {
  if (e.target === modal) modal.style.display = "none";
});
</script>
</body>
</html>
